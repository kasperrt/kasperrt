name: prod

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: [self-hosted, k3s, deployer, kasperrt-kasperrt]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: .build/scripts/build-static.sh
      - run: .build/scripts/deploy-static.sh
        env:
          STATIC_SITE_NAME: kasperrt.me
